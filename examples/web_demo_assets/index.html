<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuantaSlice — Quantum Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #05080f;
    --panel-glass: rgba(13, 19, 33, 0.6);
    --border-glass: rgba(255, 255, 255, 0.08);
    --text-main: #f0f4f8;
    --text-muted: #7b8ba4;
    
    --neon-teal: #00f0ff;
    --neon-purple: #b026ff;
    --neon-red: #ff003c;
    --neon-blue: #0051ff;
    
    --glow-teal: 0 0 15px rgba(0, 240, 255, 0.4);
    --glow-red: 0 0 20px rgba(255, 0, 60, 0.6);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-dark);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.04) 0%, transparent 50%),
      radial-gradient(circle at 85% 30%, rgba(176, 38, 255, 0.04) 0%, transparent 50%);
    color: var(--text-main);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 24px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border-glass);
  }

  h1 {
    font-size: 28px;
    font-weight: 800;
    margin: 0;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #fff, var(--text-muted));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--neon-teal);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .conn-status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted);
  }
  .dot.live {
    background: var(--neon-teal);
    box-shadow: var(--glow-teal);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 240, 255, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
  }

  /* Metrics Bar */
  .metrics-bar {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
  }
  .metric-card {
    flex: 1;
    background: var(--panel-glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-glass);
    border-radius: 12px;
    padding: 16px 20px;
  }
  .metric-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .metric-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    color: var(--text-main);
  }

  /* Topology Area */
  .topology-container {
    position: relative;
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    min-height: 400px;
  }

  #lines-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 1;
    width: 280px;
  }

  /* Slices */
  .slice-node {
    background: var(--panel-glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-glass);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    position: relative;
  }
  .slice-title {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 1px;
  }
  .slice-eMBB .slice-title { color: var(--neon-purple); }
  .slice-URLLC .slice-title { color: var(--neon-red); }
  .slice-mMTC .slice-title { color: var(--neon-teal); }

  /* Stations */
  .station-node {
    background: var(--panel-glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-glass);
    border-radius: 16px;
    padding: 16px;
    position: relative;
    transition: all 0.3s ease;
  }
  .station-node.emergency {
    border-color: var(--neon-red);
    box-shadow: var(--glow-red);
    background: rgba(255, 0, 60, 0.05);
  }
  
  .station-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .station-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
  }
  .station-status {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 8px;
    border-radius: 20px;
    border: 1px solid var(--text-muted);
    color: var(--text-muted);
  }
  .station-node.emergency .station-status {
    border-color: var(--neon-red);
    color: var(--neon-red);
    background: rgba(255, 0, 60, 0.1);
  }

  .latency-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .latency-unit { font-size: 14px; color: var(--text-muted); font-weight: 400; }
  .latency-display.good { color: var(--neon-teal); text-shadow: var(--glow-teal); }
  .latency-display.warn { color: #ffb020; }
  .latency-display.none { color: var(--text-muted); font-size: 18px; }

  .prb-track {
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .prb-fill {
    height: 100%;
    background: var(--text-main);
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .station-node.emergency .prb-fill { background: var(--neon-red); }
  
  .prb-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
  }

  /* Connection point dots */
  .anchor {
    position: absolute;
    width: 10px; height: 10px;
    background: var(--text-muted);
    border-radius: 50%;
    top: 50%;
    transform: translateY(-50%);
  }
  .slice-node .anchor { left: -5px; }
  .station-node .anchor { right: -5px; }

  /* SVG Line Animations */
  .line-flow {
    stroke-dasharray: 10 10;
    animation: flow 1s linear infinite;
  }
  .line-flow.emergency {
    stroke-dasharray: 20 10;
    animation: flow 0.4s linear infinite;
  }
  @keyframes flow {
    to { stroke-dashoffset: -20; }
  }

  /* Controls & Log */
  .bottom-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: 8px;
    border: 1px solid var(--border-glass);
    background: var(--panel-glass);
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(10px);
  }
  .btn:hover { background: rgba(255,255,255,0.1); }
  .btn.trigger { border-color: rgba(255, 0, 60, 0.4); }
  .btn.trigger:hover { border-color: var(--neon-red); color: var(--neon-red); box-shadow: var(--glow-red); }
  .btn:disabled { opacity: 0.5; pointer-events: none; }

  .log-panel {
    background: var(--panel-glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-glass);
    border-radius: 12px;
    height: 150px;
    overflow-y: auto;
    padding: 12px;
  }
  .log-entry {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    gap: 12px;
  }
  .log-entry.emergency {
    color: var(--neon-red);
    background: rgba(255, 0, 60, 0.05);
  }
  .log-ts { color: var(--text-muted); }

  footer {
    margin-top: 20px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
<div class="wrap">
  
  <header>
    <div>
      <div class="subtitle">Real-time Allocation</div>
      <h1>Quantum Command Center</h1>
    </div>
    <div class="conn-status mono">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-text">connecting...</span>
      <span style="opacity: 0.5; margin: 0 10px;">|</span>
      <span id="solver-text">solver: ---</span>
    </div>
  </header>

  <div class="metrics-bar">
    <div class="metric-card">
      <div class="metric-label">Last Realloc Latency</div>
      <div class="metric-value" id="metric-last">---</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Avg Latency</div>
      <div class="metric-value" id="metric-avg">---</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Total Reallocations</div>
      <div class="metric-value" id="metric-count">---</div>
    </div>
  </div>

  <div class="topology-container" id="topo-container">
    <svg id="lines-svg">
      <defs>
        <marker id="arrow-embb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#b026ff" />
        </marker>
        <marker id="arrow-normal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#00f0ff" />
        </marker>
        <marker id="arrow-emergency" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff003c" />
        </marker>
      </defs>
    </svg>
    
    <div class="col" id="stations-col">
      <!-- Injected by JS -->
    </div>

    <div class="col" id="slices-col">
      <!-- Injected by JS -->
    </div>
  </div>

  <div class="bottom-panel">
    <div>
      <div class="controls" id="controls"></div>
      <p style="font-size: 12px; color: var(--text-muted); margin-top: 12px;">
        Use buttons to force an emergency. AI auto-detection runs in the background continuously.
      </p>
    </div>
    <div class="log-panel" id="log-panel">
      <div style="text-align: center; color: var(--text-muted); font-family: monospace; margin-top: 20px;">Waiting for events...</div>
    </div>
  </div>

  <footer>
    Last updated: <span id="last-update">—</span> (Polling /state every 300ms)
  </footer>
</div>

<script>
const POLL_MS = 300;
let stationsData = [];
let slicesData = [];
let renderedStationIds = null;
let renderedSliceIds = null;

// Tweening state for latency numbers to make them smoothly count down/up
const latencyTweens = {};

function animateValue(obj, start, end, duration) {
  let startTimestamp = null;
  const step = (timestamp) => {
    if (!startTimestamp) startTimestamp = timestamp;
    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
    const current = start + progress * (end - start);
    obj.innerHTML = current.toFixed(1) + '<span class="latency-unit">ms</span>';
    if (progress < 1) {
      window.requestAnimationFrame(step);
    }
  };
  window.requestAnimationFrame(step);
}

function renderSlices(allSlices) {
  slicesData = allSlices;
  const col = document.getElementById("slices-col");
  const key = allSlices.map(s => s.slice_id).join(',');
  if (key === renderedSliceIds) return;
  renderedSliceIds = key;

  let html = '';
  allSlices.forEach(slice => {
    // Normalizing slice type string class
    let tClass = '';
    if (slice.slice_type === 'EMBB' || slice.slice_type === 'eMBB') tClass = 'slice-eMBB';
    else if (slice.slice_type === 'URLLC') tClass = 'slice-URLLC';
    else if (slice.slice_type === 'MMTC' || slice.slice_type === 'mMTC') tClass = 'slice-mMTC';
    
    html += `
      <div class="slice-node ${tClass}" id="slice-${slice.slice_id}" style="padding: 12px;">
        <div class="slice-title" style="font-size: 14px;">${slice.slice_id} <span style="font-size: 11px; opacity: 0.7;">(${slice.slice_type})</span></div>
        <div style="font-size: 11px; color: var(--text-muted);">${slice.prb} PRB</div>
        <div class="anchor"></div>
      </div>
    `;
  });
  col.innerHTML = html;
}

function renderStations(stations) {
  stationsData = stations;
  const col = document.getElementById("stations-col");
  
  let html = '';
  stations.forEach(st => {
    const pct = st.capacity > 0 ? Math.min(100, (st.used / st.capacity) * 100) : 0;
    
    // Latency handling
    let latencyClass = 'none';
    let latencyText = '---';
    if (st.urllc_latency_ms !== null && st.urllc_latency_ms !== undefined) {
      if (st.urllc_latency_ms < 2.0) latencyClass = 'good';
      else latencyClass = 'warn';
      latencyText = st.urllc_latency_ms.toFixed(1) + '<span class="latency-unit">ms</span>';
    }

    html += `
      <div class="station-node ${st.emergency ? 'emergency' : ''}" id="station-${st.gnb_id}">
        <div class="anchor"></div>
        <div class="station-header">
          <div class="station-name">${st.gnb_id}</div>
          <div class="station-status">${st.emergency ? 'EMERGENCY' : 'IDLE'}</div>
        </div>
        
        <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px;">URLLC Latency</div>
        <div class="latency-display ${latencyClass}" id="lat-${st.gnb_id}">${latencyText}</div>
        
        <div class="prb-track"><div class="prb-fill" style="width:${pct}%"></div></div>
        <div class="prb-text">${st.used.toFixed(0)} / ${st.capacity.toFixed(0)} PRB</div>
      </div>
    `;
  });
  
  // Real DOM update to preserve transitions
  stations.forEach(st => {
    let node = document.getElementById(`station-${st.gnb_id}`);
    if (!node) {
       // First time render
       col.innerHTML = html;
       return;
    }
    
    // Update existing node
    if (st.emergency) node.classList.add('emergency');
    else node.classList.remove('emergency');
    
    node.querySelector('.station-status').innerText = st.emergency ? 'EMERGENCY' : 'IDLE';
    node.querySelector('.prb-fill').style.width = (st.capacity > 0 ? (st.used / st.capacity) * 100 : 0) + '%';
    node.querySelector('.prb-text').innerText = `${st.used.toFixed(0)} / ${st.capacity.toFixed(0)} PRB`;
    
    const latEl = node.querySelector('.latency-display');
    if (st.urllc_latency_ms !== null && st.urllc_latency_ms !== undefined) {
       if (st.urllc_latency_ms < 2.0) { latEl.className = 'latency-display good'; }
       else { latEl.className = 'latency-display warn'; }
       
       const currentVal = parseFloat(latEl.innerText) || st.urllc_latency_ms;
       if (Math.abs(currentVal - st.urllc_latency_ms) > 0.2) {
          animateValue(latEl, currentVal, st.urllc_latency_ms, 300);
       } else {
          latEl.innerHTML = st.urllc_latency_ms.toFixed(1) + '<span class="latency-unit">ms</span>';
       }
    } else {
       latEl.className = 'latency-display none';
       latEl.innerText = '---';
    }
  });

  requestAnimationFrame(drawLines);
}

function drawLines() {
  const svg = document.getElementById('lines-svg');
  const container = document.getElementById('topo-container');
  if (!container) return;
  const cRect = container.getBoundingClientRect();
  
  let svgHtml = `
    <defs>
      <marker id="arrow-embb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#b026ff" />
      </marker>
      <marker id="arrow-normal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#00f0ff" />
      </marker>
      <marker id="arrow-emergency" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff003c" />
      </marker>
    </defs>
  `;
  
  stationsData.forEach(st => {
    const stNode = document.getElementById(`station-${st.gnb_id}`);
    if (!stNode) return;
    
    const sourceAnchor = stNode.querySelector('.anchor');
    const sRect = sourceAnchor.getBoundingClientRect();
    const x1 = sRect.left - cRect.left + sRect.width/2;
    const y1 = sRect.top - cRect.top + sRect.height/2;

    st.slices.forEach(slice => {
      const sliceNode = document.getElementById(`slice-${slice.slice_id}`);
      if (!sliceNode) return;
      
      const targetAnchor = sliceNode.querySelector('.anchor');
      const tRect = targetAnchor.getBoundingClientRect();
      const x2 = tRect.left - cRect.left + tRect.width/2;
      const y2 = tRect.top - cRect.top + tRect.height/2;
      
      // Bezier curve points
      const cp1x = x1 + 80;
      const cp1y = y1;
      const cp2x = x2 - 80;
      const cp2y = y2;
      
      let color = 'rgba(255,255,255,0.2)';
      let isEmergency = false;
      let marker = 'arrow-normal';
      
      if (slice.slice_type === 'URLLC') {
        color = st.emergency ? '#ff003c' : '#00f0ff';
        isEmergency = st.emergency;
        marker = st.emergency ? 'arrow-emergency' : 'arrow-normal';
      } else if (slice.slice_type === 'EMBB' || slice.slice_type === 'eMBB') {
        color = '#b026ff';
        marker = 'arrow-embb';
      } else {
        color = '#00f0ff';
        marker = 'arrow-normal';
      }
      
      const strokeWidth = isEmergency ? 4 : 2;
      const cssClass = isEmergency ? 'line-flow emergency' : 'line-flow';
      
      // Shadow/Glow effect for emergency
      let filter = isEmergency ? 'filter="drop-shadow(0 0 8px #ff003c)"' : '';
      
      svgHtml += `<path class="${cssClass}" d="M ${x1} ${y1} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${strokeWidth}" marker-end="url(#${marker})" ${filter} />`;
    });
  });
  
  svg.innerHTML = svgHtml;
}

// Redraw lines on window resize
window.addEventListener('resize', drawLines);

function renderControls(stationIds) {
  const key = stationIds.join(",");
  if (key === renderedStationIds) return;
  renderedStationIds = key;

  const box = document.getElementById("controls");
  const btns = stationIds.map(
    id => `<button class="btn trigger" data-gnb="${id}">🚨 Trigger ${id}</button>`
  ).join("");
  box.innerHTML = btns + `<button class="btn reset" id="reset-btn" style="border-color: var(--text-muted);">↺ Reset</button>`;

  box.querySelectorAll(".btn.trigger").forEach(btn => {
    btn.addEventListener("click", () => callAction(`/trigger?gnb=${btn.dataset.gnb}`, btn));
  });
  document.getElementById("reset-btn").addEventListener("click", (e) => callAction("/reset", e.target));
}

async function callAction(path, btn) {
  btn.disabled = true;
  try { await fetch(path, { method: "POST" }); } 
  catch (e) {} 
  finally { setTimeout(() => { btn.disabled = false; }, 400); }
}

function renderLog(events) {
  const log = document.getElementById("log-panel");
  if (!events || events.length === 0) return;
  
  log.innerHTML = events.map(e => {
    const ts = e.timestamp.match(/T(\d{2}:\d{2}:\d{2})/)?.[1] || e.timestamp;
    return `<div class="log-entry ${e.emergency ? 'emergency' : ''}">
      <span class="log-ts">[${ts}]</span>
      <span style="font-weight: bold; width: 60px;">${e.gnb_id}</span>
      <span>${e.allocation_summary}</span>
    </div>`;
  }).join("");
}

async function poll() {
  try {
    const res = await fetch("/state", { cache: "no-store" });
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();

    document.getElementById("conn-dot").className = "dot live";
    document.getElementById("conn-text").innerText = "LIVE";
    document.getElementById("solver-text").innerText = "solver: " + data.solver;
    
    if (data.last_update) {
      document.getElementById("last-update").innerText = data.last_update.match(/T(\d{2}:\d{2}:\d{2})/)?.[1] || data.last_update;
    }

    if(data.metric) {
      document.getElementById("metric-last").innerText = data.metric.last_latency_ms != null ? data.metric.last_latency_ms.toFixed(1) + 'ms' : '---';
      document.getElementById("metric-avg").innerText = data.metric.avg_latency_ms != null ? data.metric.avg_latency_ms.toFixed(1) + 'ms' : '---';
      document.getElementById("metric-count").innerText = data.metric.n_reallocations || '0';
    }

    if(data.all_slices) {
      renderSlices(data.all_slices);
    }
    renderStations(data.stations || []);
    renderControls(data.station_ids || []);
    renderLog(data.events || []);

  } catch (e) {
    document.getElementById("conn-dot").className = "dot";
    document.getElementById("conn-text").innerText = "DISCONNECTED";
  } finally {
    setTimeout(poll, POLL_MS);
  }
}

poll();
</script>
</body>
</html>
