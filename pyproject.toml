[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta_slice"
version = "0.1.0"
description = "5G Network Slice Optimization via QAOA"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Do Duc Long", email = "longvongola@gmail.com"}
]

dependencies = [
    "qiskit>=2.3.0",
    "qiskit-aer>=0.17.0",
    "qiskit-algorithms>=0.4.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "networkx>=3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
