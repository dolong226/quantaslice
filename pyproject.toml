[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantaslice"
version = "0.1.0"
description = "AI + Quantum framework cho emergency-aware 5G network slicing (Quantathon 2026)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
quantum = ["qiskit>=1.0", "qiskit-aer>=0.14", "qiskit-optimization>=0.6"]
ai = ["torch>=2.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
